<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#12372f">
  <title>بریف پروژه نرم‌افزاری | CodiMan</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Vazirmatn:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <style>
    :root {
      --ink: #14221f;
      --muted: #677773;
      --line: #dfe8e5;
      --paper: #fff;
      --wash: #f3f7f5;
      --brand: #1f6f5c;
      --brand-dark: #12372f;
      --accent: #e9b949;
      --danger: #c2413b;
      --telegram: #229ed9;
      --shadow: 0 16px 40px rgba(18, 55, 47, .08);
      --radius: 22px;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      color: var(--ink);
      background:
        radial-gradient(circle at 90% 0, rgba(233, 185, 73, .12), transparent 25rem),
        linear-gradient(180deg, #f8fbfa 0, var(--wash) 100%);
      font-family: "Vazirmatn", "Inter", sans-serif;
      min-height: 100vh;
      padding-bottom: 112px;
    }
    body[dir="ltr"] { font-family: "Inter", "Vazirmatn", sans-serif; }
    button, input, textarea, select { font: inherit; }
    button { cursor: pointer; }
    a { color: inherit; }

    .topbar {
      position: sticky;
      inset-block-start: 0;
      z-index: 20;
      border-bottom: 1px solid rgba(223, 232, 229, .9);
      background: rgba(255, 255, 255, .88);
      backdrop-filter: blur(14px);
    }
    .topbar-inner {
      width: min(760px, calc(100% - 32px));
      margin: auto;
      min-height: 66px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }
    .brand { font-weight: 900; letter-spacing: -.04em; font-size: 18px; }
    .brand em { color: var(--brand); font-style: normal; }
    .top-actions { display: flex; align-items: center; gap: 10px; }
    .save-state { color: var(--muted); font-size: 11px; white-space: nowrap; }
    .lang-switch {
      display: flex;
      padding: 3px;
      border: 1px solid var(--line);
      background: var(--wash);
      border-radius: 12px;
    }
    .lang-switch button {
      border: 0;
      background: transparent;
      color: var(--muted);
      padding: 6px 10px;
      border-radius: 9px;
      font-size: 11px;
      font-weight: 800;
    }
    .lang-switch button.active { background: var(--paper); color: var(--brand-dark); box-shadow: 0 2px 8px rgba(18,55,47,.1); }

    .progress-track { height: 3px; background: #e7efec; }
    .progress-fill { width: 0; height: 100%; background: linear-gradient(90deg, var(--brand), var(--accent)); transition: width .3s ease; }

    main { width: min(760px, calc(100% - 32px)); margin: auto; }
    .hero { padding: 54px 12px 28px; text-align: center; }
    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 7px 12px;
      border: 1px solid #d7e7e1;
      border-radius: 999px;
      color: var(--brand);
      background: rgba(255,255,255,.7);
      font-size: 11px;
      font-weight: 800;
    }
    .eyebrow::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); }
    h1 { margin: 18px 0 10px; font-size: clamp(28px, 6vw, 44px); line-height: 1.25; letter-spacing: -.04em; }
    .hero p { max-width: 580px; margin: auto; color: var(--muted); font-size: 14px; line-height: 2; }
    .hero-meta { display: flex; justify-content: center; flex-wrap: wrap; gap: 8px; margin-top: 18px; }
    .meta-chip { padding: 7px 11px; border-radius: 999px; background: #e8f1ee; color: #3f6259; font-size: 10px; font-weight: 700; }

    .section-card {
      position: relative;
      margin: 14px 0;
      padding: 26px;
      background: var(--paper);
      border: 1px solid rgba(223, 232, 229, .95);
      border-radius: var(--radius);
      box-shadow: 0 5px 18px rgba(18, 55, 47, .035);
    }
    .section-heading { display: flex; align-items: flex-start; gap: 13px; margin-bottom: 22px; }
    .step {
      display: grid;
      place-items: center;
      flex: 0 0 30px;
      height: 30px;
      border-radius: 10px;
      color: white;
      background: var(--brand-dark);
      font-size: 11px;
      font-weight: 900;
      box-shadow: 0 6px 14px rgba(18,55,47,.18);
    }
    h2 { font-size: 16px; margin: 1px 0 3px; }
    .section-heading p { color: var(--muted); font-size: 11px; margin: 0; line-height: 1.7; }
    .fields { display: grid; gap: 17px; }
    .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .field label, .group-label { display: block; margin-bottom: 7px; font-size: 11px; color: #40534e; font-weight: 800; }
    .required { color: var(--danger); }
    .optional { color: #92a19d; font-weight: 500; }
    .input {
      width: 100%;
      min-height: 46px;
      padding: 11px 13px;
      color: var(--ink);
      background: #fbfdfc;
      border: 1.5px solid var(--line);
      border-radius: 13px;
      transition: .2s ease;
    }
    textarea.input { min-height: 82px; resize: vertical; line-height: 1.75; }
    .input::placeholder { color: #a0aca9; }
    .input:focus { outline: 0; border-color: var(--brand); box-shadow: 0 0 0 4px rgba(31,111,92,.09); background: white; }
    .input.invalid { border-color: var(--danger); box-shadow: 0 0 0 4px rgba(194,65,59,.08); }
    .error { display: none; margin-top: 5px; color: var(--danger); font-size: 10px; }
    .error.show { display: block; }
    .hint { margin: 6px 1px 0; color: #879692; font-size: 10px; line-height: 1.7; }

    .choice-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px; }
    .choice {
      position: relative;
      display: flex;
      align-items: center;
      gap: 10px;
      min-height: 48px;
      padding: 10px 12px;
      border: 1.5px solid var(--line);
      border-radius: 13px;
      background: #fff;
      color: #4b5e59;
      font-size: 11px;
      font-weight: 650;
      cursor: pointer;
      transition: .16s ease;
      user-select: none;
    }
    .choice:hover { border-color: #8ab5a8; transform: translateY(-1px); }
    .choice:has(input:checked) { color: var(--brand-dark); border-color: var(--brand); background: #edf6f3; box-shadow: inset 0 0 0 1px rgba(31,111,92,.08); }
    .choice input { width: 16px; height: 16px; margin: 0; accent-color: var(--brand); flex: 0 0 auto; }
    .choice small { display: block; color: var(--muted); font-size: 9px; font-weight: 500; margin-top: 2px; }

    details.advanced { margin-top: 18px; border-top: 1px dashed var(--line); padding-top: 15px; }
    details.advanced summary {
      list-style: none;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: var(--brand);
      font-size: 11px;
      font-weight: 800;
      cursor: pointer;
    }
    details.advanced summary::-webkit-details-marker { display: none; }
    details.advanced summary::after { content: "+"; display: grid; place-items: center; width: 23px; height: 23px; border-radius: 8px; background: #edf6f3; font-size: 16px; }
    details[open].advanced summary::after { content: "−"; }
    .advanced-content { padding-top: 17px; }

    .tradeoff {
      overflow: hidden;
      background: linear-gradient(145deg, var(--brand-dark), #1d5549);
      color: white;
      border: 0;
    }
    .tradeoff .step { color: var(--brand-dark); background: var(--accent); }
    .tradeoff h2 { color: white; }
    .tradeoff .section-heading p { color: #c7d8d3; }
    .tradeoff-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .trade-choice {
      display: grid;
      place-items: center;
      min-height: 112px;
      padding: 14px 8px;
      text-align: center;
      border: 1px solid rgba(255,255,255,.18);
      border-radius: 17px;
      background: rgba(255,255,255,.07);
      cursor: pointer;
      transition: .18s ease;
    }
    .trade-choice input { position: absolute; opacity: 0; pointer-events: none; }
    .trade-choice:has(input:checked) { border-color: var(--accent); background: rgba(233,185,73,.16); transform: translateY(-2px); }
    .trade-icon { font-size: 26px; margin-bottom: 6px; }
    .trade-choice b { font-size: 12px; }
    .trade-choice small { color: #c9dad5; font-size: 9px; margin-top: 3px; }
    .trade-result {
      min-height: 46px;
      margin-top: 12px;
      padding: 11px 14px;
      border-radius: 13px;
      background: rgba(0,0,0,.15);
      color: #dce9e5;
      font-size: 10px;
      line-height: 1.7;
      text-align: center;
    }
    .trade-result.ready { background: rgba(233,185,73,.14); color: #fff4cf; }

    .moscow { display: grid; gap: 10px; }
    .priority-row { display: grid; grid-template-columns: 110px 1fr; gap: 10px; align-items: stretch; }
    .priority-tag { display: flex; flex-direction: column; justify-content: center; padding: 12px; border-radius: 13px; font-size: 11px; font-weight: 900; }
    .priority-tag small { font-size: 8px; font-weight: 600; opacity: .72; margin-top: 3px; }
    .must { background: #fce9e7; color: #9d342f; }
    .should { background: #fff4d7; color: #7d5a08; }
    .could { background: #e6f3ef; color: #246454; }
    .wont { background: #edf0f2; color: #59666b; }
    .priority-row textarea { min-height: 66px; }

    .notice { padding: 13px 15px; border-radius: 13px; background: #f0f6f4; color: #58706a; font-size: 10px; line-height: 1.8; }
    .privacy { display: flex; align-items: flex-start; gap: 8px; color: var(--muted); font-size: 10px; line-height: 1.7; }

    .actionbar {
      position: fixed;
      inset-inline: 0;
      inset-block-end: 0;
      z-index: 30;
      padding: 12px 16px max(12px, env(safe-area-inset-bottom));
      border-top: 1px solid var(--line);
      background: rgba(255,255,255,.94);
      backdrop-filter: blur(14px);
      box-shadow: 0 -12px 35px rgba(18,55,47,.08);
    }
    .actionbar-inner { width: min(760px, 100%); margin: auto; display: grid; grid-template-columns: 1.35fr 1fr auto; gap: 9px; }
    .action {
      min-height: 48px;
      border: 0;
      border-radius: 14px;
      padding: 10px 14px;
      color: white;
      font-size: 11px;
      font-weight: 850;
      transition: .16s ease;
    }
    .action:hover { transform: translateY(-1px); filter: brightness(.97); }
    .action:disabled { opacity: .55; cursor: wait; transform: none; }
    .action-primary { background: var(--telegram); }
    .action-dark { background: var(--brand-dark); }
    .action-ghost { color: #53635f; background: #edf2f0; }

    .toast {
      position: fixed;
      inset-block-start: 78px;
      inset-inline-start: 50%;
      z-index: 50;
      max-width: calc(100% - 32px);
      padding: 11px 17px;
      color: white;
      background: #172622;
      border-radius: 13px;
      box-shadow: var(--shadow);
      font-size: 11px;
      font-weight: 750;
      opacity: 0;
      transform: translate(-50%, -12px);
      pointer-events: none;
      transition: .25s ease;
      white-space: nowrap;
    }
    [dir="rtl"] .toast { transform: translate(50%, -12px); }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }
    [dir="rtl"] .toast.show { transform: translate(50%, 0); }

    #pdf-report {
      width: 794px;
      background: white;
      color: #182622;
      font-family: "Vazirmatn", "Inter", sans-serif;
      pointer-events: none;
    }
    #pdf-report:empty { display: none; }
    .pdf-page { padding: 46px 50px; }
    .pdf-head { border-bottom: 3px solid #1f6f5c; padding-bottom: 20px; margin-bottom: 25px; }
    .pdf-headline { display: flex; justify-content: space-between; align-items: flex-end; gap: 20px; }
    .pdf-brand { color: #1f6f5c; font-weight: 900; font-size: 14px; }
    .pdf-title { margin: 9px 0 0; font-size: 25px; line-height: 1.4; }
    .pdf-date { color: #71807c; font-size: 10px; white-space: nowrap; }
    .pdf-section { break-inside: avoid; margin: 0 0 19px; }
    .pdf-section h3 { margin: 0 0 8px; padding-bottom: 5px; color: #1f6f5c; border-bottom: 1px solid #dce7e3; font-size: 13px; }
    .pdf-row { display: grid; grid-template-columns: 155px 1fr; gap: 12px; padding: 5px 0; font-size: 10px; line-height: 1.65; }
    .pdf-label { color: #75837f; font-weight: 700; }
    .pdf-value { white-space: pre-wrap; overflow-wrap: anywhere; }
    .pdf-empty { color: #a5b0ad; }
    .pdf-footer { margin-top: 28px; padding-top: 12px; border-top: 1px solid #e1e9e6; color: #8b9894; font-size: 9px; text-align: center; }

    @media (max-width: 620px) {
      body { padding-bottom: 168px; }
      .topbar-inner, main { width: min(100% - 22px, 760px); }
      .save-state { display: none; }
      .hero { padding-top: 38px; }
      .section-card { padding: 21px 17px; border-radius: 18px; }
      .two-col { grid-template-columns: 1fr; }
      .choice-grid { grid-template-columns: 1fr; }
      .tradeoff-grid { gap: 7px; }
      .trade-choice { min-height: 104px; padding: 10px 4px; }
      .trade-choice small { max-width: 84px; }
      .priority-row { grid-template-columns: 82px 1fr; }
      .actionbar-inner { grid-template-columns: 1fr 1fr; }
      .action-primary { grid-column: 1 / -1; }
      .action-ghost { display: none; }
    }
  </style>
</head>
<body>
  <div class="topbar">
    <div class="topbar-inner">
      <div class="brand">Codi<em>Man</em></div>
      <div class="top-actions">
        <span id="save-state" class="save-state" data-fa="پاسخ‌ها روی همین دستگاه ذخیره می‌شوند" data-en="Answers are saved on this device"></span>
        <div class="lang-switch" aria-label="Language">
          <button id="lang-fa" type="button" class="active" onclick="setLanguage('fa')">فا</button>
          <button id="lang-en" type="button" onclick="setLanguage('en')">EN</button>
        </div>
      </div>
    </div>
    <div class="progress-track"><div id="progress-fill" class="progress-fill"></div></div>
  </div>

  <main>
    <header class="hero">
      <span class="eyebrow" data-fa="شروع یک همکاری شفاف" data-en="Start with shared clarity"></span>
      <h1 data-fa="بریف هوشمند پروژه نرم‌افزاری" data-en="Smart software project brief"></h1>
      <p data-fa="لازم نیست فنی باشید. فقط مسئله و اولویت‌ها را بگویید؛ جزئیات اختیاری‌اند و بعداً با هم کاملشان می‌کنیم." data-en="You do not need to be technical. Tell us the problem and priorities; details are optional and we can refine them together."></p>
      <div class="hero-meta">
        <span class="meta-chip" data-fa="حدود ۵ تا ۷ دقیقه" data-en="About 5–7 minutes"></span>
        <span class="meta-chip" data-fa="فقط ۲ پاسخ الزامی" data-en="Only 2 required answers"></span>
        <span class="meta-chip" data-fa="ذخیره خودکار" data-en="Auto-saved"></span>
        <span class="meta-chip" data-fa="خروجی PDF" data-en="PDF export"></span>
      </div>
    </header>

    <form id="brief-form" novalidate>
      <section class="section-card" id="section-basics">
        <div class="section-heading">
          <span class="step">01</span>
          <div>
            <h2 data-fa="پروژه در یک نگاه" data-en="Project at a glance"></h2>
            <p data-fa="دو پاسخ کوتاه برای شروع کافی است." data-en="Two short answers are enough to get started."></p>
          </div>
        </div>
        <div class="fields">
          <div class="two-col">
            <div class="field">
              <label for="project-name"><span data-fa="نام پروژه یا برند" data-en="Project or brand name"></span> <span class="required">*</span></label>
              <input class="input" id="project-name" name="projectName" required autocomplete="organization" data-ph-fa="مثلاً پلتفرم سلامت آریا" data-ph-en="e.g. Aria Health Platform">
              <span class="error" data-fa="لطفاً یک نام وارد کنید." data-en="Please enter a name."></span>
            </div>
            <div class="field">
              <label for="organization-type"><span data-fa="شما در چه مرحله‌ای هستید؟" data-en="What stage are you at?"></span> <span class="optional" data-fa="(اختیاری)" data-en="(optional)"></span></label>
              <select class="input" id="organization-type" name="organizationType">
                <option value="" data-fa="انتخاب کنید" data-en="Select"></option>
                <option value="idea" data-fa="ایده / استارتاپ در شروع" data-en="Idea / early startup"></option>
                <option value="startup" data-fa="استارتاپ فعال" data-en="Operating startup"></option>
                <option value="small-business" data-fa="کسب‌وکار کوچک یا شخصی" data-en="Small or solo business"></option>
                <option value="company" data-fa="شرکت یا سازمان" data-en="Company or enterprise"></option>
                <option value="team" data-fa="تیم، انجمن یا مجموعه غیرانتفاعی" data-en="Team, community, or nonprofit"></option>
                <option value="individual" data-fa="پروژه شخصی" data-en="Personal project"></option>
              </select>
            </div>
          </div>
          <div class="field">
            <label for="problem"><span data-fa="چه مسئله‌ای باید حل شود؟" data-en="What problem should this solve?"></span> <span class="required">*</span></label>
            <textarea class="input" id="problem" name="problem" required data-ph-fa="الان چه چیزی سخت، کند یا پرهزینه است و بعد از ساخت پروژه چه چیزی باید بهتر شود؟" data-ph-en="What is difficult, slow, or expensive today—and what should improve after launch?"></textarea>
            <span class="error" data-fa="لطفاً مسئله اصلی را کوتاه توضیح دهید." data-en="Please briefly describe the main problem."></span>
          </div>
          <div class="field">
            <label for="existing"><span data-fa="لینک محصول، سایت یا نمونه فعلی" data-en="Current product, website, or reference link"></span> <span class="optional" data-fa="(اختیاری)" data-en="(optional)"></span></label>
            <input class="input" id="existing" name="existing" inputmode="url" data-ph-fa="https://… یا هنوز چیزی نداریم" data-ph-en="https://… or nothing exists yet">
          </div>
        </div>
      </section>

      <section class="section-card">
        <div class="section-heading">
          <span class="step">02</span>
          <div>
            <h2 data-fa="نوع محصول و نتیجه مطلوب" data-en="Product type and desired outcome"></h2>
            <p data-fa="حداکثر دو نوع و سه نتیجه انتخاب کنید." data-en="Choose up to two types and three outcomes."></p>
          </div>
        </div>
        <span class="group-label" data-fa="قرار است چه چیزی ساخته یا بهتر شود؟" data-en="What should be built or improved?"></span>
        <div class="choice-grid" id="product-types">
          <label class="choice"><input type="checkbox" name="productType" value="website"><span data-fa="وب‌سایت شرکتی / محتوایی" data-en="Corporate / content website"></span></label>
          <label class="choice"><input type="checkbox" name="productType" value="webapp"><span data-fa="وب‌اپلیکیشن یا پنل" data-en="Web app or dashboard"></span></label>
          <label class="choice"><input type="checkbox" name="productType" value="mobile"><span data-fa="اپلیکیشن موبایل" data-en="Mobile application"></span></label>
          <label class="choice"><input type="checkbox" name="productType" value="commerce"><span data-fa="فروشگاه یا مارکت‌پلیس" data-en="E-commerce or marketplace"></span></label>
          <label class="choice"><input type="checkbox" name="productType" value="automation"><span data-fa="اتوماسیون، ربات یا ابزار داخلی" data-en="Automation, bot, or internal tool"></span></label>
          <label class="choice"><input type="checkbox" name="productType" value="api"><span data-fa="بک‌اند، API یا یکپارچه‌سازی" data-en="Backend, API, or integration"></span></label>
          <label class="choice"><input type="checkbox" name="productType" value="ai"><span data-fa="هوش مصنوعی یا پروژه داده" data-en="AI or data project"></span></label>
          <label class="choice"><input type="checkbox" name="productType" value="maintenance"><span data-fa="بازطراحی، رفع مشکل یا توسعه محصول فعلی" data-en="Redesign, fixes, or extending a product"></span></label>
          <label class="choice"><input type="checkbox" name="productType" value="unsure"><span data-fa="مطمئن نیستم؛ پیشنهاد بدهید" data-en="Not sure—please recommend"></span></label>
        </div>
        <div style="height:17px"></div>
        <span class="group-label" data-fa="موفقیت این پروژه چه شکلی است؟" data-en="What would success look like?"></span>
        <div class="choice-grid" id="outcomes">
          <label class="choice"><input type="checkbox" name="outcome" value="sales"><span data-fa="فروش یا درآمد بیشتر" data-en="More sales or revenue"></span></label>
          <label class="choice"><input type="checkbox" name="outcome" value="leads"><span data-fa="لید، تماس یا ثبت‌نام بیشتر" data-en="More leads, calls, or signups"></span></label>
          <label class="choice"><input type="checkbox" name="outcome" value="efficiency"><span data-fa="کاهش کار دستی و هزینه" data-en="Less manual work and cost"></span></label>

        idea: ["ایده / استارتاپ در شروع", "Idea / early startup"],
        startup: ["استارتاپ فعال", "Operating startup"],
        "small-business": ["کسب‌وکار کوچک یا شخصی", "Small or solo business"],
        company: ["شرکت یا سازمان", "Company or enterprise"],
        team: ["تیم، انجمن یا مجموعه غیرانتفاعی", "Team, community, or nonprofit"],
        individual: ["پروژه شخصی", "Personal project"]
      },
      productType: {
        website: ["وب‌سایت شرکتی / محتوایی", "Corporate / content website"],
        webapp: ["وب‌اپلیکیشن یا پنل", "Web app or dashboard"],
        mobile: ["اپلیکیشن موبایل", "Mobile application"],
        commerce: ["فروشگاه یا مارکت‌پلیس", "E-commerce or marketplace"],
        automation: ["اتوماسیون، ربات یا ابزار داخلی", "Automation, bot, or internal tool"],
        api: ["بک‌اند، API یا یکپارچه‌سازی", "Backend, API, or integration"],
        ai: ["هوش مصنوعی یا پروژه داده", "AI or data project"],
        maintenance: ["بازطراحی، رفع مشکل یا توسعه محصول فعلی", "Redesign, fixes, or extending a product"],
        unsure: ["مطمئن نیستم؛ پیشنهاد بدهید", "Not sure—please recommend"]
      },
      outcome: {
        sales: ["فروش یا درآمد بیشتر", "More sales or revenue"],
        leads: ["لید، تماس یا ثبت‌نام بیشتر", "More leads, calls, or signups"],
        efficiency: ["کاهش کار دستی و هزینه", "Less manual work and cost"],
        experience: ["تجربه بهتر برای کاربر", "Better user experience"],
        launch: ["اعتبارسنجی و عرضه سریع MVP", "Validate and launch an MVP"],
        scale: ["مقیاس‌پذیری و پایداری", "Scale and reliability"],
        brand: ["اعتبار و تصویر حرفه‌ای برند", "Brand trust and professional image"],
        compliance: ["امنیت یا انطباق قانونی", "Security or compliance"]
      },
      tradeoff: {
        quality: ["کیفیت و عمق", "Quality & depth"],
        speed: ["سرعت عرضه", "Speed to launch"],
        cost: ["بودجه اقتصادی", "Lean budget"]
      },
      risk: {
        login: ["ورود و حساب کاربری", "Login and user accounts"],
        payment: ["پرداخت یا تراکنش مالی", "Payments or financial transactions"],
        sensitive: ["داده شخصی یا حساس", "Personal or sensitive data"],
        migration: ["انتقال داده از سیستم قبلی", "Data migration from another system"],
        compliance: ["الزام قانونی یا صنفی", "Legal or industry compliance"],
        "high-traffic": ["ترافیک یا مقیاس بالا", "High traffic or scale"]
      },
      vibe: {
        minimal: ["مینیمال و روشن", "Minimal and clear"],
        professional: ["حرفه‌ای و قابل‌اعتماد", "Professional and trustworthy"],
        premium: ["لوکس و ممتاز", "Premium and refined"],
        friendly: ["صمیمی و انسانی", "Friendly and human"],
        bold: ["جسور و پرانرژی", "Bold and energetic"],
        tech: ["مدرن و تکنولوژیک", "Modern and technical"],
        accessible: ["ساده و در دسترس برای همه", "Simple and accessible"],
        recommend: ["پیشنهاد شما را می‌خواهم", "I want your recommendation"]
      },
      budgetMode: {
        estimate: ["برآورد بر اساس راهکار پیشنهادی", "Estimate based on proposed solution"],
        range: ["بازه بودجه مشخص", "Defined budget range"],
        phased: ["نسخه مرحله‌ای و اقتصادی", "Lean, phased release"],
        unknown: ["هنوز تصمیم‌گیری نشده", "Not decided yet"]
      },
      timelineMode: {
        fixed: ["ددلاین قطعی", "Fixed deadline"],
        target: ["تاریخ هدف منعطف", "Flexible target date"],
        soon: ["هرچه زودتر با پیشنهاد مجری", "As soon as practical"],
        quality: ["کیفیت مهم‌تر از تاریخ", "Quality over deadline"]
      },
      brandAssets: {
        ready: ["آماده و قابل استفاده", "Ready to use"],
        partial: ["نیازمند بهبود", "Needs improvement"],
        none: ["باید طراحی شود", "Needs design"]
      },
      contentStatus: {
        ready: ["کاملاً آماده", "Fully ready"],
        partial: ["بخشی آماده", "Partly ready"],
        none: ["نیازمند کمک برای تولید", "Needs content support"]
      }
    };

    const reportCopy = {
      fa: {
        title: "بریف پروژه نرم‌افزاری",
        empty: "اعلام نشده",
        yes: "بله",
        sections: [
          ["پروژه در یک نگاه", [["نام پروژه / برند","projectName"],["مرحله کسب‌وکار","organizationType"],["مسئله اصلی","problem"],["محصول یا لینک فعلی","existing"]]],
          ["هدف و محصول", [["نوع محصول","productType"],["نتیجه مطلوب","outcome"],["معیار موفقیت","successMetric"]]],
          ["کاربران و تجربه", [["کاربر اصلی","audience"],["مسیر اصلی کاربر","coreJourney"],["نقش‌ها و دسترسی‌ها","roles"]]],
          ["اولویت قابلیت‌ها", [["باید باشد","mustHave"],["بهتر است باشد","shouldHave"],["اگر شد","couldHave"],["فعلاً خارج از نسخه","wontHave"]]],
          ["موازنه پروژه", [["دو اولویت منتخب","tradeoff"],["اثر انتخاب","tradeoffResult"]]],
          ["فناوری، داده و ریسک", [["یکپارچه‌سازی‌ها","integrations"],["موارد حساس","risk"],["محدودیت‌های فنی","constraints"],["نیازهای ویژه","nonFunctional"]]],
          ["طراحی و محتوا", [["حال‌وهوای بصری","vibe"],["نمونه‌های مرجع","references"],["وضعیت برند","brandAssets"],["وضعیت محتوا","contentStatus"]]],
          ["بودجه و زمان", [["ترجیح بودجه","budgetMode"],["بازه بودجه","budgetRange"],["زمان‌بندی","timelineMode"],["تاریخ هدف","targetDate"],["تصمیم‌گیرنده","decision"]]],
          ["اطلاعات تکمیلی", [["نکات و خطوط قرمز","notes"],["نام تماس","contactName"],["راه ارتباطی","contactWay"]]]
        ],
        footer: "این سند به‌صورت محلی با فرم CodiMan ساخته شده است."
      },
      en: {
        title: "Software Project Brief",
        empty: "Not provided",
        yes: "Yes",
        sections: [
          ["Project at a glance", [["Project / brand name","projectName"],["Organization stage","organizationType"],["Core problem","problem"],["Existing product or link","existing"]]],
          ["Product and outcomes", [["Product type","productType"],["Desired outcomes","outcome"],["Success metric","successMetric"]]],
          ["Users and experience", [["Primary user","audience"],["Core user journey","coreJourney"],["Roles and permissions","roles"]]],
          ["Feature priorities", [["Must have","mustHave"],["Should have","shouldHave"],["Could have","couldHave"],["Not this release","wontHave"]]],
          ["Project trade-off", [["Selected priorities","tradeoff"],["Expected effect","tradeoffResult"]]],
          ["Technology, data, and risk", [["Integrations","integrations"],["Risk flags","risk"],["Technical constraints","constraints"],["Special requirements","nonFunctional"]]],
          ["Design and content", [["Visual direction","vibe"],["References","references"],["Brand assets","brandAssets"],["Content status","contentStatus"]]],
          ["Budget and timing", [["Budget preference","budgetMode"],["Budget range","budgetRange"],["Timeline preference","timelineMode"],["Target date","targetDate"],["Decision maker","decision"]]],
          ["Additional information", [["Notes and red lines","notes"],["Contact name","contactName"],["Contact method","contactWay"]]]
        ],
        footer: "This document was generated locally using the CodiMan brief."
      }
    };

    function setLanguage(next) {
      lang = next;
      localStorage.setItem(`${STORAGE_KEY}:lang`, lang);
      document.documentElement.lang = lang;
      document.documentElement.dir = lang === "fa" ? "rtl" : "ltr";
      document.body.dir = document.documentElement.dir;
      document.title = lang === "fa" ? "بریف پروژه نرم‌افزاری | CodiMan" : "Software Project Brief | CodiMan";
      document.querySelectorAll("[data-fa][data-en]").forEach(el => {
        el.textContent = el.dataset[lang];
      });
      document.querySelectorAll("[data-ph-fa][data-ph-en]").forEach(el => {
        el.placeholder = el.dataset[`ph${lang === "fa" ? "Fa" : "En"}`];
      });
      document.getElementById("lang-fa").classList.toggle("active", lang === "fa");
      document.getElementById("lang-en").classList.toggle("active", lang === "en");
      updateTradeoff();
      updateProgress();
    }

    function enforceLimit(name, max) {
      form.querySelectorAll(`input[name="${name}"]`).forEach(input => {
        input.addEventListener("change", () => {
          const checked = [...form.querySelectorAll(`input[name="${name}"]:checked`)];
          if (checked.length > max) {
            input.checked = false;
            showToast(lang === "fa" ? `حداکثر ${toFa(max)} انتخاب مجاز است.` : `Choose up to ${max}.`);
          }
        });
      });
    }

    function toFa(value) {
      return String(value).replace(/\d/g, d => "۰۱۲۳۴۵۶۷۸۹"[d]);
    }

    function updateTradeoff() {
      const selected = checkedValues("tradeoff");
      const result = document.getElementById("trade-result");
      const fa = {
        "quality,speed": "کیفیت + سرعت: برای حفظ عمق و تست در زمان کمتر، بودجه یا منابع بیشتری لازم است.",
        "cost,quality": "کیفیت + بودجه اقتصادی: دامنه نسخه اول کوچک‌تر و زمان‌بندی منعطف‌تر می‌شود.",
        "cost,speed": "سرعت + بودجه اقتصادی: یک MVP محدود تحویل می‌شود؛ کیفیت پایه حفظ می‌شود اما عمق و جزئیات کمتر است."
      };
      const en = {
        "quality,speed": "Quality + speed: keeping depth and testing in less time requires more budget or resources.",
        "cost,quality": "Quality + lean budget: the first-release scope gets smaller and the timeline more flexible.",
        "cost,speed": "Speed + lean budget: expect a tightly scoped MVP; baseline quality stays, but depth and polish are reduced."
      };
      const key = [...selected].sort().join(",");
      result.textContent = selected.length === 2
        ? (lang === "fa" ? fa[key] : en[key])
        : (lang === "fa" ? "دو گزینه را انتخاب کنید تا اثر انتخابتان را ببینید." : "Choose two options to see the trade-off.");
      result.classList.toggle("ready", selected.length === 2);
    }

    function formState() {
      const state = {};
      new FormData(form).forEach((value, key) => {
        if (state[key]) state[key] = [].concat(state[key], value);
        else state[key] = value;
      });
      return state;
    }

    function saveDraft() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(formState()));
      const el = document.getElementById("save-state");
      el.textContent = lang === "fa" ? "ذخیره شد ✓" : "Saved ✓";
      clearTimeout(saveDraft.timer);
      saveDraft.timer = setTimeout(() => {
        el.textContent = el.dataset[lang];
      }, 1500);
    }

    function restoreDraft() {
      try {
        const state = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");
        Object.entries(state).forEach(([name, stored]) => {
          const controls = form.querySelectorAll(`[name="${CSS.escape(name)}"]`);
          const values = [].concat(stored);
          controls.forEach(control => {
            if (control.type === "checkbox" || control.type === "radio") control.checked = values.includes(control.value);
            else control.value = stored;
          });
        });
      } catch (_) {
        localStorage.removeItem(STORAGE_KEY);
      }
    }

    function clearDraft() {
      const ok = confirm(lang === "fa" ? "همه پاسخ‌های ذخیره‌شده پاک شوند؟" : "Clear all saved answers?");
      if (!ok) return;
      form.reset();
      localStorage.removeItem(STORAGE_KEY);
      document.getElementById("budget-range-wrap").hidden = true;
      updateTradeoff();
      updateProgress();
      showToast(lang === "fa" ? "پاسخ‌ها پاک شدند." : "Answers cleared.");
    }

    function checkedValues(name) {
      return [...form.querySelectorAll(`input[name="${name}"]:checked`)].map(el => el.value);
    }

    function updateProgress() {
      const checkpoints = [
        value("projectName"), value("problem"), checkedValues("productType").length,
        checkedValues("outcome").length, value("audience"), value("coreJourney"),
        value("mustHave"), checkedValues("tradeoff").length === 2, value("integrations"),
        checkedValues("vibe").length, getRadio("budgetMode"), value("contactWay")
      ];
      const pct = Math.round(checkpoints.filter(Boolean).length / checkpoints.length * 100);
      document.getElementById("progress-fill").style.width = `${pct}%`;
    }

    function value(name) {
      return (form.elements[name]?.value || "").trim();
    }

    function getRadio(name) {
      return form.querySelector(`input[name="${name}"]:checked`)?.value || "";
    }

    function validateForm() {
      const required = ["projectName", "problem"];
      let firstInvalid = null;
      required.forEach(name => {
        const input = form.elements[name];
        const invalid = !input.value.trim();
        input.classList.toggle("invalid", invalid);
        input.parentElement.querySelector(".error")?.classList.toggle("show", invalid);
        if (invalid && !firstInvalid) firstInvalid = input;
      });
      if (firstInvalid) {
        firstInvalid.closest(".section-card").scrollIntoView({ behavior: "smooth", block: "center" });
        firstInvalid.focus({ preventScroll: true });
        showToast(lang === "fa" ? "لطفاً دو پاسخ الزامی را کامل کنید." : "Please complete the two required answers.");
        return false;
      }
      return true;
    }

    function localized(group, code) {
      if (!code) return "";
      const pair = labels[group]?.[code];
      return pair ? pair[lang === "fa" ? 0 : 1] : code;
    }

    function displayValue(key) {
      if (["productType", "outcome", "tradeoff", "risk", "vibe"].includes(key)) {
        return checkedValues(key).map(code => localized(key, code)).join(lang === "fa" ? "، " : ", ");
      }
      if (["budgetMode"].includes(key)) return localized(key, getRadio(key));
      if (["organizationType", "timelineMode", "brandAssets", "contentStatus"].includes(key)) {
        return localized(key, value(key));
      }
      if (key === "tradeoffResult") {
        return checkedValues("tradeoff").length === 2 ? document.getElementById("trade-result").textContent : "";
      }
      return value(key);
    }

    function escapeHtml(text) {
      const div = document.createElement("div");
      div.textContent = text;
      return div.innerHTML;
    }

    function buildReport() {
      const copy = reportCopy[lang];
      const project = value("projectName");
      const date = new Intl.DateTimeFormat(lang === "fa" ? "fa-IR" : "en-GB", { dateStyle: "long" }).format(new Date());
      const sections = copy.sections.map(([title, rows]) => {
        const body = rows.map(([label, key]) => {
          const answer = displayValue(key);
          return `<div class="pdf-row"><div class="pdf-label">${escapeHtml(label)}</div><div class="pdf-value${answer ? "" : " pdf-empty"}">${escapeHtml(answer || copy.empty)}</div></div>`;
        }).join("");
        return `<section class="pdf-section"><h3>${escapeHtml(title)}</h3>${body}</section>`;
      }).join("");
      document.getElementById("pdf-report").innerHTML = `
        <div class="pdf-page" dir="${lang === "fa" ? "rtl" : "ltr"}">
          <header class="pdf-head">
            <div class="pdf-headline">
              <div><div class="pdf-brand">CodiMan</div><h1 class="pdf-title">${escapeHtml(copy.title)} — ${escapeHtml(project)}</h1></div>
              <div class="pdf-date">${escapeHtml(date)}</div>
            </div>
          </header>
          ${sections}
          <footer class="pdf-footer">${escapeHtml(copy.footer)}</footer>
        </div>`;
      return document.getElementById("pdf-report");
    }

    function safeFilename() {
      const base = value("projectName") || "project";
      const safe = base.replace(/[\\/:*?"<>|]/g, "-").replace(/\s+/g, "_").slice(0, 60);
      return `CodiMan_Brief_${safe}.pdf`;
    }

    function pdfOptions() {
      return {
        margin: 0,
        filename: safeFilename(),
        image: { type: "jpeg", quality: .96 },
        html2canvas: { scale: 1.55, useCORS: true, letterRendering: true, backgroundColor: "#ffffff" },
        jsPDF: { unit: "pt", format: "a4", orientation: "portrait" },
        pagebreak: { mode: ["css", "legacy"], avoid: [".pdf-section"] }
      };
    }

    async function createPdfBlob() {
      if (typeof html2pdf === "undefined") throw new Error("PDF library unavailable");
      await document.fonts.ready;
      const report = buildReport();
      return html2pdf().set(pdfOptions()).from(report).toPdf().outputPdf("blob");
    }

    function setBusy(busy) {
      document.querySelectorAll("[data-action]").forEach(button => {
        button.disabled = busy;
        if (busy) button.dataset.oldText = button.textContent;
        button.textContent = busy
          ? (lang === "fa" ? "در حال ساخت PDF…" : "Creating PDF…")
          : (button.dataset.oldText || button.textContent);
      });
    }

    async function handleAction(type) {
      if (!validateForm()) return;
      setBusy(true);
      try {
        if (type === "download") {
          const report = buildReport();
          await document.fonts.ready;
          await html2pdf().set(pdfOptions()).from(report).save();
          showToast(lang === "fa" ? "PDF دانلود شد." : "PDF downloaded.");
        } else {
          const blob = await createPdfBlob();
          const file = new File([blob], safeFilename(), { type: "application/pdf" });
          if (navigator.canShare?.({ files: [file] })) {
            await navigator.share({
              files: [file],
              title: reportCopy[lang].title,
              text: lang === "fa" ? "بریف پروژه برای CodiMan" : "Project brief for CodiMan"
            });
          } else {
            const url = URL.createObjectURL(blob);
            const link = document.createElement("a");
            link.href = url;
            link.download = safeFilename();
            link.click();
            setTimeout(() => URL.revokeObjectURL(url), 2000);
            window.open(`https://t.me/${TELEGRAM_USERNAME}`, "_blank", "noopener");
            showToast(lang === "fa"
              ? "PDF دانلود شد؛ آن را در گفت‌وگوی بازشده پیوست کنید."
              : "PDF downloaded; attach it in the opened chat.");
          }
        }
      } catch (error) {
        if (error?.name !== "AbortError") {
          console.error(error);
          showToast(lang === "fa" ? "ساخت PDF ممکن نشد؛ اتصال اینترنت را بررسی کنید." : "Could not create the PDF. Check your connection.");
        }
      } finally {
        document.getElementById("pdf-report").replaceChildren();
        setBusy(false);
      }
    }

    function showToast(message) {
      const toast = document.getElementById("toast");
      clearTimeout(toastTimer);
      toast.textContent = message;
      toast.classList.add("show");
      toastTimer = setTimeout(() => toast.classList.remove("show"), 3600);
    }

    form.addEventListener("input", event => {
      if (event.target.matches("[required]")) {
        event.target.classList.remove("invalid");
        event.target.parentElement.querySelector(".error")?.classList.remove("show");
      }
      saveDraft();
      updateProgress();
    });
    form.addEventListener("change", event => {
      if (event.target.name === "tradeoff") updateTradeoff();
      if (event.target.name === "budgetMode") {
        document.getElementById("budget-range-wrap").hidden = event.target.value !== "range";
      }
      saveDraft();
      updateProgress();
    });

    enforceLimit("productType", 2);
    enforceLimit("outcome", 3);
    enforceLimit("vibe", 3);
    enforceLimit("tradeoff", 2);
    restoreDraft();
    document.getElementById("budget-range-wrap").hidden = getRadio("budgetMode") !== "range";
    setLanguage(lang);
  </script>
</body>
</html>
