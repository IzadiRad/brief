<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#12372f">
  <meta name="description" content="بریف هوشمند پروژه نرم‌افزاری CodiMan — بدون نیاز به دانش فنی، در چند دقیقه پروژه‌تان را شفاف کنید و خروجی PDF بگیرید.">
  <title>بریف پروژه نرم‌افزاری | CodiMan</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2312372f'/%3E%3Ctext x='32' y='42' font-size='30' font-weight='bold' text-anchor='middle' fill='%23e9b949' font-family='sans-serif'%3EC%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Vazirmatn:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <style>
    :root {
      --ink: #14221f;
      --muted: #63736e;
      --line: #dfe8e5;
      --paper: #fff;
      --wash: #f3f7f5;
      --brand: #1f6f5c;
      --brand-dark: #12372f;
      --accent: #e9b949;
      --danger: #c2413b;
      --telegram: #229ed9;
      --shadow: 0 16px 40px rgba(18, 55, 47, .08);
      --radius: 22px;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      color: var(--ink);
      background:
        radial-gradient(circle at 90% 0, rgba(233, 185, 73, .12), transparent 25rem),
        linear-gradient(180deg, #f8fbfa 0, var(--wash) 100%);
      font-family: "Vazirmatn", "Inter", sans-serif;
      min-height: 100vh;
      padding-bottom: 118px;
    }
    body[dir="ltr"] { font-family: "Inter", "Vazirmatn", sans-serif; }
    button, input, textarea, select { font: inherit; }
    button { cursor: pointer; }
    a { color: inherit; }
    :focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; border-radius: 6px; }

    .topbar {
      position: sticky;
      inset-block-start: 0;
      z-index: 20;
      border-bottom: 1px solid rgba(223, 232, 229, .9);
      background: rgba(255, 255, 255, .9);
      backdrop-filter: blur(14px);
    }
    .topbar-inner {
      width: min(760px, calc(100% - 32px));
      margin: auto;
      min-height: 62px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }
    .brand { font-weight: 900; letter-spacing: -.04em; font-size: 18px; }
    .brand em { color: var(--brand); font-style: normal; }
    .top-actions { display: flex; align-items: center; gap: 10px; }
    .save-state { color: var(--muted); font-size: 11px; white-space: nowrap; }
    .progress-label {
      min-width: 44px;
      padding: 5px 9px;
      border-radius: 999px;
      background: #e8f1ee;
      color: var(--brand-dark);
      font-size: 11px;
      font-weight: 800;
      text-align: center;
      white-space: nowrap;
    }
    .lang-switch {
      display: flex;
      padding: 3px;
      border: 1px solid var(--line);
      background: var(--wash);
      border-radius: 12px;
    }
    .lang-switch button {
      border: 0;
      background: transparent;
      color: var(--muted);
      padding: 6px 10px;
      border-radius: 9px;
      font-size: 11px;
      font-weight: 800;
    }
    .lang-switch button.active { background: var(--paper); color: var(--brand-dark); box-shadow: 0 2px 8px rgba(18,55,47,.1); }

    .step-nav {
      width: min(760px, calc(100% - 32px));
      margin: auto;
      display: flex;
      gap: 6px;
      padding: 2px 0 9px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .step-nav::-webkit-scrollbar { display: none; }
    .step-chip {
      flex: 0 0 auto;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 6px 11px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: #fff;
      color: var(--muted);
      font-size: 10.5px;
      font-weight: 750;
      transition: .16s ease;
      white-space: nowrap;
    }
    .step-chip .dot { width: 7px; height: 7px; border-radius: 50%; background: #cfdbd7; transition: .16s ease; }
    .step-chip.done .dot { background: var(--brand); box-shadow: 0 0 0 3px rgba(31,111,92,.14); }
    .step-chip.active { border-color: var(--brand); color: var(--brand-dark); background: #edf6f3; }
    .step-chip:hover { border-color: #8ab5a8; }

    .progress-track { height: 3px; background: #e7efec; }
    .progress-fill { width: 0; height: 100%; background: linear-gradient(90deg, var(--brand), var(--accent)); transition: width .3s ease; }

    main { width: min(760px, calc(100% - 32px)); margin: auto; }
    .hero { padding: 50px 12px 26px; text-align: center; }
    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 7px 12px;
      border: 1px solid #d7e7e1;
      border-radius: 999px;
      color: var(--brand);
      background: rgba(255,255,255,.7);
      font-size: 11px;
      font-weight: 800;
    }
    .eyebrow::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); }
    h1 { margin: 18px 0 10px; font-size: clamp(28px, 6vw, 44px); line-height: 1.25; letter-spacing: -.04em; }
    .hero p { max-width: 580px; margin: auto; color: var(--muted); font-size: 14.5px; line-height: 2; }
    .hero-meta { display: flex; justify-content: center; flex-wrap: wrap; gap: 8px; margin-top: 18px; }
    .meta-chip { padding: 7px 11px; border-radius: 999px; background: #e8f1ee; color: #3f6259; font-size: 10.5px; font-weight: 700; }

    .section-card {
      position: relative;
      margin: 14px 0;
      padding: 26px;
      background: var(--paper);
      border: 1px solid rgba(223, 232, 229, .95);
      border-radius: var(--radius);
      box-shadow: 0 5px 18px rgba(18, 55, 47, .035);
      scroll-margin-top: 132px;
    }
    .section-heading { display: flex; align-items: flex-start; gap: 13px; margin-bottom: 22px; }
    .step {
      display: grid;
      place-items: center;
      flex: 0 0 30px;
      height: 30px;
      border-radius: 10px;
      color: white;
      background: var(--brand-dark);
      font-size: 11px;
      font-weight: 900;
      box-shadow: 0 6px 14px rgba(18,55,47,.18);
      transition: .2s ease;
    }
    .step.done { background: var(--brand); font-size: 13px; }
    h2 { font-size: 16.5px; margin: 1px 0 3px; }
    .section-heading p { color: var(--muted); font-size: 11.5px; margin: 0; line-height: 1.7; }
    .fields { display: grid; gap: 17px; }
    .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .field label, .group-label { display: block; margin-bottom: 7px; font-size: 12px; color: #40534e; font-weight: 800; }
    .group-label { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .count { padding: 2px 8px; border-radius: 999px; background: #eef4f2; color: #6d827c; font-size: 10px; font-weight: 700; }
    .count.full { background: #e2f0ea; color: var(--brand); }
    .required { color: var(--danger); }
    .optional { color: #92a19d; font-weight: 500; }
    .input {
      width: 100%;
      min-height: 47px;
      padding: 11px 13px;
      color: var(--ink);
      background: #fbfdfc;
      border: 1.5px solid var(--line);
      border-radius: 13px;
      transition: .2s ease;
    }
    textarea.input { min-height: 84px; resize: vertical; line-height: 1.75; }
    .input::placeholder { color: #a0aca9; }
    .input:focus { outline: 0; border-color: var(--brand); box-shadow: 0 0 0 4px rgba(31,111,92,.09); background: white; }
    .input.invalid { border-color: var(--danger); box-shadow: 0 0 0 4px rgba(194,65,59,.08); }
    .error { display: none; margin-top: 5px; color: var(--danger); font-size: 10.5px; }
    .error.show { display: block; }
    .hint { margin: 6px 1px 0; color: #879692; font-size: 11px; line-height: 1.7; }

    .choice-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px; }
    .choice {
      position: relative;
      display: flex;
      align-items: center;
      gap: 10px;
      min-height: 50px;
      padding: 10px 12px;
      border: 1.5px solid var(--line);
      border-radius: 13px;
      background: #fff;
      color: #4b5e59;
      font-size: 12px;
      font-weight: 650;
      cursor: pointer;
      transition: .16s ease;
      user-select: none;
    }
    .choice:hover { border-color: #8ab5a8; transform: translateY(-1px); }
    .choice:has(input:checked) { color: var(--brand-dark); border-color: var(--brand); background: #edf6f3; box-shadow: inset 0 0 0 1px rgba(31,111,92,.08); }
    .choice:has(input:focus-visible) { outline: 2px solid var(--brand); outline-offset: 2px; }
    .choice input { width: 17px; height: 17px; margin: 0; accent-color: var(--brand); flex: 0 0 auto; }
    .choice small { display: block; color: var(--muted); font-size: 9px; font-weight: 500; margin-top: 2px; }

    details.advanced { margin-top: 18px; border-top: 1px dashed var(--line); padding-top: 15px; }
    details.advanced summary {
      list-style: none;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: var(--brand);
      font-size: 11.5px;
      font-weight: 800;
      cursor: pointer;
    }
    details.advanced summary::-webkit-details-marker { display: none; }
    details.advanced summary::after { content: "+"; display: grid; place-items: center; width: 23px; height: 23px; border-radius: 8px; background: #edf6f3; font-size: 16px; }
    details[open].advanced summary::after { content: "−"; }
    .advanced-content { padding-top: 17px; }

    .tradeoff {
      overflow: hidden;
      background: linear-gradient(145deg, var(--brand-dark), #1d5549);
      color: white;
      border: 0;
    }
    .tradeoff .step { color: var(--brand-dark); background: var(--accent); }
    .tradeoff .step.done { background: var(--accent); }
    .tradeoff h2 { color: white; }
    .tradeoff .section-heading p { color: #c7d8d3; }
    .tradeoff-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .trade-choice {
      display: grid;
      place-items: center;
      min-height: 112px;
      padding: 14px 8px;
      text-align: center;
      border: 1px solid rgba(255,255,255,.18);
      border-radius: 17px;
      background: rgba(255,255,255,.07);
      cursor: pointer;
      transition: .18s ease;
    }
    .trade-choice input { position: absolute; opacity: 0; pointer-events: none; }
    .trade-choice:has(input:checked) { border-color: var(--accent); background: rgba(233,185,73,.16); transform: translateY(-2px); }
    .trade-choice:has(input:focus-visible) { outline: 2px solid var(--accent); outline-offset: 2px; }
    .trade-icon { font-size: 26px; margin-bottom: 6px; }
    .trade-choice b { font-size: 12.5px; }
    .trade-choice small { color: #c9dad5; font-size: 9.5px; margin-top: 3px; }
    .trade-result {
      min-height: 46px;
      margin-top: 12px;
      padding: 11px 14px;
      border-radius: 13px;
      background: rgba(0,0,0,.15);
      color: #dce9e5;
      font-size: 11px;
      line-height: 1.7;
      text-align: center;
    }
    .trade-result.ready { background: rgba(233,185,73,.14); color: #fff4cf; }

    .moscow { display: grid; gap: 10px; }
    .priority-row { display: grid; grid-template-columns: 110px 1fr; gap: 10px; align-items: stretch; }
    .priority-tag { display: flex; flex-direction: column; justify-content: center; padding: 12px; border-radius: 13px; font-size: 11.5px; font-weight: 900; }
    .priority-tag small { font-size: 8.5px; font-weight: 600; opacity: .72; margin-top: 3px; }
    .must { background: #fce9e7; color: #9d342f; }
    .should { background: #fff4d7; color: #7d5a08; }
    .could { background: #e6f3ef; color: #246454; }
    .wont { background: #edf0f2; color: #59666b; }
    .priority-row textarea { min-height: 66px; }

    .notice { padding: 13px 15px; border-radius: 13px; background: #f0f6f4; color: #58706a; font-size: 10.5px; line-height: 1.8; }
    .privacy { display: flex; align-items: flex-start; gap: 9px; color: var(--muted); font-size: 10.5px; line-height: 1.7; cursor: pointer; }
    .privacy input { width: 16px; height: 16px; margin-top: 2px; accent-color: var(--brand); flex: 0 0 auto; }

    .actionbar {
      position: fixed;
      inset-inline: 0;
      inset-block-end: 0;
      z-index: 30;
      padding: 12px 16px max(12px, env(safe-area-inset-bottom));
      border-top: 1px solid var(--line);
      background: rgba(255,255,255,.94);
      backdrop-filter: blur(14px);
      box-shadow: 0 -12px 35px rgba(18,55,47,.08);
    }
    .actionbar-inner { width: min(760px, 100%); margin: auto; display: grid; grid-template-columns: 1.35fr 1fr auto; gap: 9px; }
    .action {
      min-height: 48px;
      border: 0;
      border-radius: 14px;
      padding: 10px 14px;
      color: white;
      font-size: 11.5px;
      font-weight: 850;
      transition: .16s ease;
    }
    .action:hover { transform: translateY(-1px); filter: brightness(.97); }
    .action:disabled { opacity: .55; cursor: wait; transform: none; }
    .action-primary { background: var(--telegram); }
    .action-dark { background: var(--brand-dark); }
    .action-ghost { color: #53635f; background: #edf2f0; }

    .overlay {
      position: fixed;
      inset: 0;
      z-index: 60;
      display: grid;
      place-items: center;
      padding: 16px;
      background: rgba(15, 26, 23, .48);
      backdrop-filter: blur(5px);
    }
    .overlay[hidden] { display: none; }
    .modal {
      width: min(680px, 100%);
      max-height: min(84vh, 760px);
      display: flex;
      flex-direction: column;
      background: #fff;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 30px 80px rgba(0, 0, 0, .3);
    }
    .modal-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      padding: 19px 22px 14px;
      border-bottom: 1px solid var(--line);
    }
    .modal-head h3 { margin: 0 0 4px; font-size: 15.5px; }
    .modal-head p { margin: 0; color: var(--muted); font-size: 11px; line-height: 1.7; }
    .modal-close {
      flex: 0 0 32px;
      height: 32px;
      display: grid;
      place-items: center;
      border: 0;
      border-radius: 10px;
      background: #eef3f1;
      color: #53635f;
      font-size: 15px;
      line-height: 1;
    }
    .modal-body { overflow-y: auto; padding: 8px 22px 14px; }
    .modal-note {
      margin: 12px 0 4px;
      padding: 10px 13px;
      border-radius: 12px;
      font-size: 10.5px;
      line-height: 1.8;
      background: #fdf4dd;
      color: #7d5a08;
    }
    .modal-note.ok { background: #eaf4f0; color: #2c5d50; }
    .review-section { padding: 13px 0 4px; }
    .review-section h4 {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 0 0 4px;
      color: var(--brand);
      font-size: 12px;
    }
    .review-section h4::after { content: ""; flex: 1; height: 1px; background: #e3ece9; }
    .review-row {
      display: grid;
      grid-template-columns: 160px 1fr;
      gap: 12px;
      padding: 7px 0;
      border-bottom: 1px dashed #eef3f1;
      font-size: 12px;
      line-height: 1.8;
    }
    .review-row:last-child { border-bottom: 0; }
    .review-row .k { color: #75837f; font-weight: 750; font-size: 11px; padding-top: 1px; }
    .review-row .v { white-space: pre-wrap; word-break: break-word; }
    .review-row .v.empty { color: #a7b3af; }
    .modal-foot {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 8px;
      padding: 13px 22px calc(15px + env(safe-area-inset-bottom));
      border-top: 1px solid var(--line);
      background: #fbfdfc;
    }
    .modal-foot .action { min-height: 46px; }

    .toast {
      position: fixed;
      inset-block-start: 78px;
      inset-inline-start: 50%;
      z-index: 70;
      max-width: calc(100% - 32px);
      padding: 11px 17px;
      color: white;
      background: #172622;
      border-radius: 13px;
      box-shadow: var(--shadow);
      font-size: 11.5px;
      font-weight: 750;
      opacity: 0;
      transform: translate(-50%, -12px);
      pointer-events: none;
      transition: .25s ease;
      white-space: nowrap;
    }
    [dir="rtl"] .toast { transform: translate(50%, -12px); }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }
    [dir="rtl"] .toast.show { transform: translate(50%, 0); }

    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      *, *::before, *::after { transition: none !important; animation: none !important; }
    }

    @media (max-width: 620px) {
      body { padding-bottom: 178px; }
      .topbar-inner, main, .step-nav { width: min(100% - 22px, 760px); }
      .save-state { display: none; }
      .hero { padding-top: 36px; }
      .section-card { padding: 21px 17px; border-radius: 18px; scroll-margin-top: 122px; }
      .two-col { grid-template-columns: 1fr; }
      .choice-grid { grid-template-columns: 1fr; }
      .tradeoff-grid { gap: 7px; }
      .trade-choice { min-height: 104px; padding: 10px 4px; }
      .trade-choice small { max-width: 84px; }
      .priority-row { grid-template-columns: 82px 1fr; }
      .actionbar-inner { grid-template-columns: 1fr auto; }
      .actionbar .action-primary { grid-column: 1 / -1; }
      .action-ghost { padding-inline: 16px; }
      .review-row { grid-template-columns: 1fr; gap: 2px; padding: 9px 0; }
      .modal { max-height: 88vh; border-radius: 18px; }
      .modal-foot { grid-template-columns: 1fr 1.4fr; }
    }
  </style>
</head>
<body>
  <div class="topbar">
    <div class="topbar-inner">
      <div class="brand">Codi<em>Man</em></div>
      <div class="top-actions">
        <span id="save-state" class="save-state" role="status" data-fa="پاسخ‌ها روی همین دستگاه ذخیره می‌شوند" data-en="Answers are saved on this device"></span>
        <span id="progress-label" class="progress-label" aria-hidden="true"></span>
        <div class="lang-switch" aria-label="Language">
          <button id="lang-fa" type="button" class="active" onclick="setLanguage('fa')">فا</button>
          <button id="lang-en" type="button" onclick="setLanguage('en')">EN</button>
        </div>
      </div>
    </div>
    <nav id="step-nav" class="step-nav" aria-label="Sections"></nav>
    <div class="progress-track" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="progress-track"><div id="progress-fill" class="progress-fill"></div></div>
  </div>

  <main>
    <header class="hero">
      <span class="eyebrow" data-fa="آغاز یک همکاری شفاف" data-en="Start with shared clarity"></span>
      <h1 id="hero-title" data-fa="بریف هوشمند پروژه نرم‌افزاری" data-en="Smart software project brief"></h1>
      <p id="hero-lead" data-fa="تکمیل این فرم به دانش فنی نیاز ندارد. مسئله و اولویت‌های پروژه را مشخص کنید؛ بخش‌های تکمیلی تنها در صورت انتخاب شما به فرم افزوده می‌شوند و پیش از ارسال، تمامی پاسخ‌ها قابل مرور است." data-en="No technical background is required. Define the problem and priorities; supplementary sections are added only when you select them, and every answer can be reviewed before sending."></p>
      <div class="hero-meta">
        <span class="meta-chip" data-fa="حدود ۵ تا ۷ دقیقه" data-en="About 5–7 minutes"></span>
        <span class="meta-chip" data-fa="فقط ۲ پاسخ الزامی" data-en="Only 2 required answers"></span>
        <span class="meta-chip" data-fa="ساختار ماژولار" data-en="Modular structure"></span>
        <span class="meta-chip" data-fa="ذخیره خودکار" data-en="Auto-saved"></span>
        <span class="meta-chip" data-fa="مرور پیش از ارسال" data-en="Review before sending"></span>
        <span class="meta-chip" data-fa="خروجی PDF" data-en="PDF export"></span>
      </div>
    </header>

    <form id="brief-form" novalidate>
      <section class="section-card" id="section-1" data-key="basics" data-nav-fa="معرفی" data-nav-en="Basics">
        <div class="section-heading">
          <span class="step">01</span>
          <div>
            <h2 data-fa="پروژه در یک نگاه" data-en="Project at a glance"></h2>
            <p data-fa="دو پاسخ کوتاه برای شروع کافی است." data-en="Two short answers are enough to get started."></p>
          </div>
        </div>
        <div class="fields">
          <div class="two-col">
            <div class="field">

    const allSections = [...form.querySelectorAll("section.section-card")];

    function activeModules() {
      return checkedValues("module");
    }

    function visibleSections() {
      return allSections.filter(section => !section.hidden);
    }

    function applyVisibility() {
      const modules = activeModules();
      allSections.forEach(section => {
        if (SEO_ONLY) section.hidden = !SEO_MODE_KEYS.includes(section.dataset.key);
        else if (section.dataset.module) section.hidden = !modules.includes(section.dataset.module);
        else section.hidden = false;
      });
    }

    function rebuildStepNav() {
      const nav = document.getElementById("step-nav");
      nav.innerHTML = "";
      visibleSections().forEach(section => {
        const chip = document.createElement("button");
        chip.type = "button";
        chip.className = "step-chip";
        const label = lang === "fa" ? section.dataset.navFa : section.dataset.navEn;
        chip.innerHTML = `<span class="dot" aria-hidden="true"></span><span data-fa="${section.dataset.navFa}" data-en="${section.dataset.navEn}">${label}</span>`;
        chip.addEventListener("click", () => {
          section.scrollIntoView({ behavior: "smooth", block: "start" });
        });
        nav.appendChild(chip);
      });
    }

    function updateSections() {
      const chips = document.querySelectorAll(".step-chip");
      visibleSections().forEach((section, index) => {
        const done = (sectionChecks[section.dataset.key] || (() => false))();
        chips[index]?.classList.toggle("done", done);
        const badge = section.querySelector(".step");
        if (badge) {
          badge.classList.toggle("done", done);
          badge.textContent = done ? "✓" : String(index + 1).padStart(2, "0");
        }
      });
    }

    function updateActiveSection() {
      const marker = 170;
      const current = visibleSections();
      let active = 0;
      current.forEach((section, index) => {
        if (section.getBoundingClientRect().top <= marker) active = index;
      });
      document.querySelectorAll(".step-chip").forEach((chip, index) => {
        chip.classList.toggle("active", index === active);
      });
    }

    function updateCounters() {
      document.querySelectorAll("[data-count]").forEach(el => {
        const name = el.dataset.count;
        const max = Number(el.dataset.max);
        const selected = checkedValues(name).length;
        const text = `${selected}/${max}`;
        el.textContent = lang === "fa" ? toFa(text) : text;
        el.classList.toggle("full", selected >= max);
      });
    }

    function setLanguage(next) {
      lang = next;
      localStorage.setItem(`${STORAGE_KEY}:lang`, lang);
      document.documentElement.lang = lang;
      document.documentElement.dir = lang === "fa" ? "rtl" : "ltr";
      document.body.dir = document.documentElement.dir;
      document.title = SEO_ONLY
        ? (lang === "fa" ? "بریف سئو و دیده‌شدن | CodiMan" : "SEO & Visibility Brief | CodiMan")
        : (lang === "fa" ? "بریف پروژه نرم‌افزاری | CodiMan" : "Software Project Brief | CodiMan");
      document.querySelectorAll("[data-fa][data-en]").forEach(el => {
        el.textContent = el.dataset[lang];
      });
      document.querySelectorAll("[data-ph-fa][data-ph-en]").forEach(el => {
        el.placeholder = el.dataset[`ph${lang === "fa" ? "Fa" : "En"}`];
      });
      document.getElementById("lang-fa").classList.toggle("active", lang === "fa");
      document.getElementById("lang-en").classList.toggle("active", lang === "en");
      rebuildStepNav();
      updateTradeoff();
      updateProgress();
      if (!document.getElementById("review-overlay").hidden && pendingAction) renderReview();
    }

    function enforceLimit(name, max) {
      form.querySelectorAll(`input[name="${name}"]`).forEach(input => {
        input.addEventListener("change", () => {
          const checked = [...form.querySelectorAll(`input[name="${name}"]:checked`)];
          if (checked.length > max) {
            input.checked = false;
            showToast(lang === "fa" ? `حداکثر ${toFa(max)} انتخاب مجاز است.` : `Choose up to ${max}.`);
          }
        });
      });
    }

    function toFa(value) {
      return String(value).replace(/\d/g, d => "۰۱۲۳۴۵۶۷۸۹"[d]);
    }

    function updateTradeoff() {
      const selected = checkedValues("tradeoff");
      const result = document.getElementById("trade-result");
      const fa = {
        "quality,speed": "کیفیت + سرعت: برای حفظ عمق و تست در زمان کمتر، بودجه یا منابع بیشتری لازم است.",
        "cost,quality": "کیفیت + بودجه اقتصادی: دامنه نسخه اول کوچک‌تر و زمان‌بندی منعطف‌تر می‌شود.",
        "cost,speed": "سرعت + بودجه اقتصادی: یک MVP محدود تحویل می‌شود؛ کیفیت پایه حفظ می‌شود اما عمق و جزئیات کمتر است."
      };
      const en = {
        "quality,speed": "Quality + speed: keeping depth and testing in less time requires more budget or resources.",
        "cost,quality": "Quality + lean budget: the first-release scope gets smaller and the timeline more flexible.",
        "cost,speed": "Speed + lean budget: expect a tightly scoped MVP; baseline quality stays, but depth and polish are reduced."
      };
      const key = [...selected].sort().join(",");
      result.textContent = selected.length === 2
        ? (lang === "fa" ? fa[key] : en[key])
        : (lang === "fa" ? "دو گزینه را انتخاب کنید تا اثر انتخابتان را ببینید." : "Choose two options to see the trade-off.");
      result.classList.toggle("ready", selected.length === 2);
    }

    function formState() {
      const state = {};
      new FormData(form).forEach((value, key) => {
        if (state[key]) state[key] = [].concat(state[key], value);
        else state[key] = value;
      });
      return state;
    }

    function saveDraft() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(formState()));
      const el = document.getElementById("save-state");
      el.textContent = lang === "fa" ? "ذخیره شد ✓" : "Saved ✓";
      clearTimeout(saveDraft.timer);
      saveDraft.timer = setTimeout(() => {
        el.textContent = el.dataset[lang];
      }, 1500);
    }

    function restoreDraft() {
      try {
        const state = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");
        Object.entries(state).forEach(([name, stored]) => {
          const controls = form.querySelectorAll(`[name="${CSS.escape(name)}"]`);
          const values = [].concat(stored);
          controls.forEach(control => {
            if (control.type === "checkbox" || control.type === "radio") control.checked = values.includes(control.value);
            else control.value = stored;
          });
        });
      } catch (_) {
        localStorage.removeItem(STORAGE_KEY);
      }
    }

    function clearDraft() {
      const ok = confirm(lang === "fa" ? "همه پاسخ‌های ذخیره‌شده پاک شوند؟" : "Clear all saved answers?");
      if (!ok) return;
      form.reset();
      localStorage.removeItem(STORAGE_KEY);
      document.getElementById("budget-range-wrap").hidden = true;
      applyVisibility();
      rebuildStepNav();
      updateTradeoff();
      updateProgress();
      showToast(lang === "fa" ? "پاسخ‌ها پاک شدند." : "Answers cleared.");
    }

    function checkedValues(name) {
      return [...form.querySelectorAll(`input[name="${name}"]:checked`)].map(el => el.value);
    }

    function updateProgress() {
      const modules = activeModules();
      const checkpoints = [value("projectName"), value("problem")];
      if (SEO_ONLY) {
        checkpoints.push(
          value("existing"), checkedValues("seoGoal").length, value("seoKeywords"),
          value("seoMarkets"), value("seoHistory"), value("contactWay")
        );
      } else {
        checkpoints.push(checkedValues("productType").length, checkedValues("outcome").length);
        if (modules.includes("users")) checkpoints.push(value("audience"), value("coreJourney"));
        if (modules.includes("priorities")) checkpoints.push(value("mustHave"));
        if (modules.includes("tradeoff")) checkpoints.push(checkedValues("tradeoff").length === 2);
        if (modules.includes("technical")) checkpoints.push(value("integrations") || checkedValues("risk").length);
        if (modules.includes("design")) checkpoints.push(checkedValues("vibe").length);
        if (modules.includes("budget")) checkpoints.push(getRadio("budgetMode"));
        if (modules.includes("seo")) checkpoints.push(checkedValues("seoGoal").length, value("seoKeywords"));
        checkpoints.push(value("contactWay"));
      }
      const pct = Math.round(checkpoints.filter(Boolean).length / checkpoints.length * 100);
      document.getElementById("progress-fill").style.width = `${pct}%`;
      document.getElementById("progress-track").setAttribute("aria-valuenow", String(pct));
      const label = document.getElementById("progress-label");
      label.textContent = lang === "fa" ? `${toFa(pct)}٪` : `${pct}%`;
      updateSections();
      updateCounters();
      updateActiveSection();
    }

    function value(name) {
      return (form.elements[name]?.value || "").trim();
    }

    function getRadio(name) {
      return form.querySelector(`input[name="${name}"]:checked`)?.value || "";
    }

    function validateForm() {
      const required = ["projectName", "problem"];
      let firstInvalid = null;
      required.forEach(name => {
        const input = form.elements[name];
        const invalid = !input.value.trim();
        input.classList.toggle("invalid", invalid);
        input.parentElement.querySelector(".error")?.classList.toggle("show", invalid);
        if (invalid && !firstInvalid) firstInvalid = input;
      });
      if (firstInvalid) {
        firstInvalid.closest(".section-card").scrollIntoView({ behavior: "smooth", block: "center" });
        firstInvalid.focus({ preventScroll: true });
        showToast(lang === "fa" ? "لطفاً دو پاسخ الزامی را کامل کنید." : "Please complete the two required answers.");
        return false;
      }
      return true;
    }

    function localized(group, code) {
      if (!code) return "";
      const pair = labels[group]?.[code];
      return pair ? pair[lang === "fa" ? 0 : 1] : code;
    }

    function displayValue(key) {
      if (["productType", "outcome", "tradeoff", "risk", "vibe", "seoGoal", "seoAccess"].includes(key)) {
        return checkedValues(key).map(code => localized(key, code)).join(lang === "fa" ? "، " : ", ");
      }
      if (["budgetMode"].includes(key)) return localized(key, getRadio(key));
      if (["organizationType", "timelineMode", "brandAssets", "contentStatus", "seoHistory", "seoContent"].includes(key)) {
        return localized(key, value(key));
      }
      if (key === "tradeoffResult") {
        return checkedValues("tradeoff").length === 2 ? document.getElementById("trade-result").textContent : "";
      }
      if (key === "modules") {
        const selected = activeModules().map(code => localized("module", code)).join(lang === "fa" ? "، " : ", ");
        return selected || (lang === "fa" ? "فقط بخش‌های پایه" : "Core sections only");
      }
      return value(key);
    }

    function reportSections(copy) {
      const keys = new Set(visibleSections().map(section => section.dataset.key));
      return copy.sections.filter(([, key]) => keys.has(key));
    }

    function reportTitle(copy) {
      return SEO_ONLY ? copy.seoTitle : copy.title;
    }

    function renderReview() {
      const copy = reportCopy[lang];
      const body = document.getElementById("review-body");
      body.innerHTML = "";

      const notes = [];
      if (!value("contactWay")) {
        notes.push(lang === "fa"
          ? "⚠ راه ارتباطی ثبت نشده است؛ برای پیگیری و اعلام نتیجه، افزودن ایمیل، تلگرام یا شماره تماس توصیه می‌شود."
          : "⚠ No contact method provided; adding email, Telegram, or a phone number is recommended for follow-up.");
      }
      if (!form.elements.privacyAck.checked) {
        notes.push(lang === "fa"
          ? "یادآوری: از عدم درج اطلاعات محرمانه (رمز عبور، کلید API، اطلاعات بانکی) در پاسخ‌ها اطمینان حاصل کنید."
          : "Reminder: verify that no confidential information (passwords, API keys, banking details) is included.");
      }
      notes.forEach(text => {
        const note = document.createElement("div");
        note.className = "modal-note";
        note.textContent = text;
        body.appendChild(note);
      });

      let emptyCount = 0;
      reportSections(copy).forEach(([title, , rows]) => {
        const wrap = document.createElement("div");
        wrap.className = "review-section";
        const heading = document.createElement("h4");
        heading.textContent = title;
        wrap.appendChild(heading);
        rows.forEach(([label, key]) => {
          const answer = displayValue(key);
          if (!answer) emptyCount += 1;
          const row = document.createElement("div");
          row.className = "review-row";
          const k = document.createElement("span");
          k.className = "k";
          k.textContent = label;
          const v = document.createElement("span");
          v.className = answer ? "v" : "v empty";
          v.textContent = answer || copy.empty;
          row.append(k, v);
          wrap.appendChild(row);
        });
        body.appendChild(wrap);
      });

      if (emptyCount) {
        const info = document.createElement("div");
        info.className = "modal-note ok";
        info.textContent = lang === "fa"
          ? `${toFa(emptyCount)} مورد اختیاری تکمیل نشده است؛ این موارد در جلسه آغاز پروژه قابل بررسی و تکمیل خواهند بود.`
          : `${emptyCount} optional items remain incomplete; they can be reviewed and completed during the project kickoff.`;
        body.appendChild(info);
      }

      const confirmBtn = document.getElementById("review-confirm");
      confirmBtn.textContent = pendingAction === "share"
        ? (lang === "fa" ? "تأیید و ارسال با تلگرام" : "Confirm & share via Telegram")
        : (lang === "fa" ? "تأیید و دانلود PDF" : "Confirm & download PDF");
    }

    function openReview(type) {
      pendingAction = type;
      renderReview();
      const overlay = document.getElementById("review-overlay");
      overlay.hidden = false;
      document.body.style.overflow = "hidden";
      document.getElementById("review-body").scrollTop = 0;
      document.getElementById("review-confirm").focus();
    }

    function closeReview() {
      pendingAction = null;
      document.getElementById("review-overlay").hidden = true;
      document.body.style.overflow = "";
    }

    async function confirmReview() {
      const type = pendingAction;
      if (!type) return;
      await doExport(type);
    }

    function handleAction(type) {
      if (!validateForm()) return;
      openReview(type);
    }

    function safeFilename() {
      const base = value("projectName") || "project";
      const safe = base.replace(/[\\/:*?"<>|]/g, "-").replace(/\s+/g, "_").slice(0, 60);
      return `CodiMan_${SEO_ONLY ? "SEO_Brief" : "Brief"}_${safe}.pdf`;
    }

    function wrapCanvasText(ctx, text, maxWidth) {
      const paragraphs = String(text).split(/\n/);
      const lines = [];
      paragraphs.forEach((paragraph, paragraphIndex) => {
        const words = paragraph.trim().split(/\s+/).filter(Boolean);
        if (!words.length) {
          lines.push("");
          return;
        }
        let line = "";
        words.forEach(word => {
          const candidate = line ? `${line} ${word}` : word;
          if (line && ctx.measureText(candidate).width > maxWidth) {
            lines.push(line);
            line = word;
          } else {
            line = candidate;
          }
        });
        if (line) lines.push(line);
        if (paragraphIndex < paragraphs.length - 1) lines.push("");
      });
      return lines.length ? lines : [""];
    }

    async function createPdfDocument() {
      if (!window.jspdf?.jsPDF) throw new Error("PDF library unavailable");
      await document.fonts.ready;
      await Promise.all([
        document.fonts.load('400 20px "Vazirmatn"'),
        document.fonts.load('700 20px "Vazirmatn"'),
        document.fonts.load('700 20px "Inter"')
      ]);

      const copy = reportCopy[lang];
      const rtl = lang === "fa";
      const font = rtl ? "Vazirmatn" : "Inter";
      const W = 1240;
      const H = 1754;
      const M = 82;
      const BOTTOM = H - 92;
      const LABEL_WIDTH = 265;
      const GAP = 30;
      const VALUE_WIDTH = W - (M * 2) - LABEL_WIDTH - GAP;
      const pages = [];
      let canvas;
      let ctx;
      let y;

      function setText(size, weight = 400, color = "#182622") {
        ctx.font = `${weight} ${size}px "${font}", sans-serif`;
        ctx.fillStyle = color;
        ctx.textBaseline = "top";
        ctx.direction = rtl ? "rtl" : "ltr";
      }

      function logicalX(offset = 0) {
        return rtl ? W - M - offset : M + offset;
      }

      function alignStart() {
        ctx.textAlign = rtl ? "right" : "left";
      }

      function drawPageHeader(continuation = false) {
        ctx.fillStyle = "#ffffff";
        ctx.fillRect(0, 0, W, H);
        setText(22, 800, "#1f6f5c");
        alignStart();
        ctx.fillText("CodiMan", logicalX(), 62);

        const date = new Intl.DateTimeFormat(rtl ? "fa-IR" : "en-GB", { dateStyle: "long" }).format(new Date());
        setText(17, 500, "#71807c");
        ctx.textAlign = rtl ? "left" : "right";
        ctx.fillText(date, rtl ? M : W - M, 66);

        const title = continuation
          ? (rtl ? "ادامه بریف" : "Brief — continued")
          : `${reportTitle(copy)} — ${value("projectName")}`;
        setText(38, 800, "#14221f");
        alignStart();
        const titleLines = wrapCanvasText(ctx, title, W - (M * 2));
        titleLines.slice(0, 2).forEach((line, index) => ctx.fillText(line, logicalX(), 108 + index * 50));
        const lineY = 108 + Math.min(titleLines.length, 2) * 50 + 20;
        ctx.fillStyle = "#1f6f5c";
        ctx.fillRect(M, lineY, W - (M * 2), 4);
        y = lineY + 38;
      }

      function newPage() {
        canvas = document.createElement("canvas");
        canvas.width = W;
        canvas.height = H;
        ctx = canvas.getContext("2d");
        pages.push(canvas);
        drawPageHeader(pages.length > 1);
      }

      function ensureSpace(height) {
        if (y + height > BOTTOM) newPage();
      }

      function drawSection(title, rows) {
        ensureSpace(92);
        setText(25, 800, "#1f6f5c");
        alignStart();
        ctx.fillText(title, logicalX(), y);
        y += 42;
        ctx.fillStyle = "#dce7e3";
        ctx.fillRect(M, y, W - (M * 2), 2);
        y += 18;

        rows.forEach(([label, key]) => {
          const answer = displayValue(key) || copy.empty;
          setText(20, 400, displayValue(key) ? "#182622" : "#9aa7a3");
          const answerLines = wrapCanvasText(ctx, answer, VALUE_WIDTH);
          const rowHeight = Math.max(34, answerLines.length * 31) + 16;
          ensureSpace(rowHeight);

          setText(18, 700, "#75837f");
          alignStart();
          ctx.fillText(label, logicalX(), y + 3);

          setText(20, 400, displayValue(key) ? "#182622" : "#9aa7a3");
          alignStart();
          const valueX = logicalX(LABEL_WIDTH + GAP);
          answerLines.forEach((line, index) => ctx.fillText(line, valueX, y + index * 31));
          y += rowHeight;
        });
        y += 15;
      }

      newPage();
      reportSections(copy).forEach(([title, , rows]) => drawSection(title, rows));
      ensureSpace(55);
      ctx.fillStyle = "#dce7e3";
      ctx.fillRect(M, y, W - (M * 2), 2);
      setText(15, 500, "#8b9894");
      ctx.textAlign = "center";
      ctx.fillText(copy.footer, W / 2, y + 17);

      const { jsPDF } = window.jspdf;
      const pdf = new jsPDF({ unit: "pt", format: "a4", orientation: "portrait", compress: true });
      pages.forEach((page, index) => {
        if (index) pdf.addPage("a4", "portrait");
        pdf.addImage(page.toDataURL("image/jpeg", .94), "JPEG", 0, 0, 595.28, 841.89, undefined, "FAST");
      });
      return pdf;
    }

    async function createPdfBlob() {
      const pdf = await createPdfDocument();
      return pdf.output("blob");
    }

    function setBusy(busy) {
      document.querySelectorAll("[data-action], #review-confirm").forEach(button => {
        button.disabled = busy;
        if (busy) button.dataset.oldText = button.textContent;
        button.textContent = busy
          ? (lang === "fa" ? "در حال ساخت PDF…" : "Creating PDF…")
          : (button.dataset.oldText || button.textContent);
      });
    }

    async function doExport(type) {
      setBusy(true);
      try {
        if (type === "download") {
          const pdf = await createPdfDocument();
          pdf.save(safeFilename());
          closeReview();
          showToast(lang === "fa" ? "PDF دانلود شد." : "PDF downloaded.");
        } else {
          const blob = await createPdfBlob();
          const file = new File([blob], safeFilename(), { type: "application/pdf" });
          if (navigator.canShare?.({ files: [file] })) {
            closeReview();
            await navigator.share({
              files: [file],
              title: reportTitle(reportCopy[lang]),
              text: SEO_ONLY
                ? (lang === "fa" ? "بریف سئو برای CodiMan" : "SEO brief for CodiMan")
                : (lang === "fa" ? "بریف پروژه برای CodiMan" : "Project brief for CodiMan")
            });
          } else {
            const url = URL.createObjectURL(blob);
            const link = document.createElement("a");
            link.href = url;
            link.download = safeFilename();
            link.click();
            setTimeout(() => URL.revokeObjectURL(url), 2000);
            closeReview();
            window.open(`https://t.me/${TELEGRAM_USERNAME}`, "_blank", "noopener");
            showToast(lang === "fa"
              ? "PDF دانلود شد؛ آن را در گفت‌وگوی بازشده پیوست کنید."
              : "PDF downloaded; attach it in the opened chat.");
          }
        }
      } catch (error) {
        if (error?.name !== "AbortError") {
          console.error(error);
          showToast(lang === "fa" ? "ساخت PDF ممکن نشد؛ اتصال اینترنت را بررسی کنید." : "Could not create the PDF. Check your connection.");
        }
      } finally {
        setBusy(false);
      }
    }

    function showToast(message) {
      const toast = document.getElementById("toast");
      clearTimeout(toastTimer);
      toast.textContent = message;
      toast.classList.add("show");
      toastTimer = setTimeout(() => toast.classList.remove("show"), 3600);
    }

    form.addEventListener("input", event => {
      if (event.target.matches("[required]")) {
        event.target.classList.remove("invalid");
        event.target.parentElement.querySelector(".error")?.classList.remove("show");
      }
      saveDraft();
      updateProgress();
    });
    form.addEventListener("change", event => {
      if (event.target.name === "tradeoff") updateTradeoff();
      if (event.target.name === "budgetMode") {
        document.getElementById("budget-range-wrap").hidden = event.target.value !== "range";
      }
      if (event.target.name === "module") {
        applyVisibility();
        rebuildStepNav();
        const moduleName = localized("module", event.target.value);
        showToast(event.target.checked
          ? (lang === "fa" ? `بخش «${moduleName}» به فرم افزوده شد.` : `Section “${moduleName}” added to the form.`)
          : (lang === "fa" ? `بخش «${moduleName}» از فرم حذف شد.` : `Section “${moduleName}” removed from the form.`));
      }
      saveDraft();
      updateProgress();
    });

    document.getElementById("review-overlay").addEventListener("click", event => {
      if (event.target === event.currentTarget) closeReview();
    });
    document.addEventListener("keydown", event => {
      if (event.key === "Escape" && !document.getElementById("review-overlay").hidden) closeReview();
    });
    let scrollTick = false;
    window.addEventListener("scroll", () => {
      if (scrollTick) return;
      scrollTick = true;
      requestAnimationFrame(() => {
        updateActiveSection();
        scrollTick = false;
      });
    }, { passive: true });

    function applySeoModeCopy() {
      const swap = (selector, fa, en) => {
        const el = document.querySelector(selector);
        if (!el) return;
        el.dataset.fa = fa;
        el.dataset.en = en;
      };
      swap("#hero-title", "بریف سئو و دیده‌شدن", "SEO & visibility brief");
      swap("#hero-lead",
        "این فرم برای برنامه‌ریزی سئو و دیده‌شدن طراحی شده است و پاسخ‌های آن مبنای تحلیل و پیشنهاد CodiRank قرار می‌گیرد؛ پوشش‌دهنده SEO، AEO و GEO. تکمیل آن به دانش فنی نیاز ندارد.",
        "This form is designed for SEO and visibility planning; the answers form the basis of the CodiRank analysis and proposal, covering SEO, AEO, and GEO. No technical background is required.");
      swap('label[for="problem"] span[data-fa]',
        "مهم‌ترین چالش فعلی در دیده‌شدن و جذب مخاطب چیست؟",
        "What is the main challenge in visibility and audience acquisition today?");
      const problem = document.getElementById("problem");
      problem.dataset.phFa = "مثلاً ترافیک سایت پایین است، رقبا در نتایج بالاتر هستند یا مشتریان ما را در جست‌وجو پیدا نمی‌کنند.";
      problem.dataset.phEn = "e.g. low site traffic, competitors ranking higher, or customers not finding us in search.";
      swap('label[for="existing"] span[data-fa]', "نشانی وب‌سایت", "Website URL");
      const existing = document.getElementById("existing");
      existing.dataset.phFa = "https://example.com";
      existing.dataset.phEn = "https://example.com";
    }

    enforceLimit("productType", LIMITS.productType);
    enforceLimit("outcome", LIMITS.outcome);
    enforceLimit("vibe", LIMITS.vibe);
    enforceLimit("tradeoff", LIMITS.tradeoff);
    enforceLimit("seoGoal", LIMITS.seoGoal);
    restoreDraft();
    if (SEO_ONLY) applySeoModeCopy();
    applyVisibility();
    document.getElementById("budget-range-wrap").hidden = getRadio("budgetMode") !== "range";
    setLanguage(lang);
  </script>
</body>
</html>
